#cloud-config
# PROVIDED. The same first-boot script as in the first Azure lab: read it, you will pass it to the VM as custom data.
package_update: true
packages:
  - git
  - python3-venv
users:
  - name: beanie
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/systemd/system/beanie@.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Beanie %i
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=beanie
      WorkingDirectory=/opt/beanie
      Environment=LOG_FORMAT=json
      ExecStart=/opt/beanie/venv/bin/python -m beanie %i
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
runcmd:
  - git clone --depth 1 --branch v0.1.0 https://github.com/professordiogodev/beanie.git /opt/beanie
  - python3 -m venv /opt/beanie/venv
  - /opt/beanie/venv/bin/pip install -r /opt/beanie/requirements.txt
  - systemctl daemon-reload
  - for s in gateway menu orders payments notifications; do systemctl enable --now beanie@$s; done
